[package]
name = "cargo-dirty"
version = "0.1.0"
edition = "2024"
description = "Cargo subcommand that reports only what was recompiled"
license = "MIT"
repository = "https://github.com/romnn/cargo-dirty"
readme = "README.md"
keywords = ["cargo", "build", "cache", "diagnostics", "recompilation"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
owo-colors = "4"
regex = "1"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
indexing_slicing = "deny"
missing_errors_doc = "warn"
await_holding_lock = "deny"
allow_attributes_without_reason = "deny"

map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"

[package.metadata.cargo-fc]
install_missing_targets = true
dedupe = true
aggregate_targets = false
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "aarch64-apple-darwin",
]

[package.metadata.cargo-fc.subcommands.udeps]
maximal_features = true
